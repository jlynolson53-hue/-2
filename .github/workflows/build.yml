          package android.print;

          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import java.io.File;

          public class PdfPrint {
              public interface Done { void ok(File f); void fail(String m); }
              private final PrintAttributes attrs;
              public PdfPrint(PrintAttributes a) { attrs = a; }
              public void print(final PrintDocumentAdapter ad, final File out, final Done cb) {
                  ad.onLayout(null, attrs, null, new PrintDocumentAdapter.LayoutResultCallback() {
                      @Override
                      public void onLayoutFinished(PrintDocumentInfo info, boolean changed) {
                          try {
                              final ParcelFileDescriptor pfd = ParcelFileDescriptor.open(out,
                                  ParcelFileDescriptor.MODE_CREATE | ParcelFileDescriptor.MODE_TRUNCATE | ParcelFileDescriptor.MODE_READ_WRITE);
                              ad.onWrite(new PageRange[]{PageRange.ALL_PAGES}, pfd, new CancellationSignal(), new PrintDocumentAdapter.WriteResultCallback() {
                                  @Override
                                  public void onWriteFinished(PageRange[] pages) {
                                      try { pfd.close(); } catch (Exception ignored) { }
                                      cb.ok(out);
                                  }
                                  @Override
                                  public void onWriteFailed(CharSequence e) { cb.fail(String.valueOf(e)); }
                              });
                          } catch (Exception e) { cb.fail(e.toString()); }
                      }
                      @Override
                      public void onLayoutFailed(CharSequence e) { cb.fail(String.valueOf(e)); }
                  }, null);
              }
          }
