                  @JavascriptInterface
                  public String saveFile(String name, String text) {
                      try {
                          byte[] data = text.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/VideoToNote");
                              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              OutputStream o = getContentResolver().openOutputStream(u);
                              o.write(data);
                              o.close();
                              return "已保存到：下载/VideoToNote/" + name;
                          } else {
                              File f = new File(getExternalFilesDir(null), name);
                              FileOutputStream o = new FileOutputStream(f);
                              o.write(data);
                              o.close();
                              return "已保存到：" + f.getAbsolutePath();
                          }
                      } catch (Exception e) {
                          return "保存失败：" + e;
                      }
                  }

                  @JavascriptInterface
                  public String writeText(String name, String text) {
                      try {
                          File d = new File(getFilesDir(), "mat"); d.mkdirs();
                          FileOutputStream o = new FileOutputStream(new File(d, name.replaceAll("[\\\\/]", "_")));
                          o.write(text.getBytes(StandardCharsets.UTF_8)); o.close();
                          return "ok";
                      } catch (Exception e) { return "err:" + e.getMessage(); }
                  }

                  @JavascriptInterface
                  public String readText(String name) {
                      try {
                          File f = new File(new File(getFilesDir(), "mat"), name.replaceAll("[\\\\/]", "_"));
                          if (!f.exists()) return "";
                          return new String(readFile(f), StandardCharsets.UTF_8);
                      } catch (Exception e) { return ""; }
                  }

