                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/VideoToNote");
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          OutputStream o = getContentResolver().openOutputStream(u);
                          o.write(data); o.close();
                          return "已保存到：下载/VideoToNote/" + name;
                      } else {
                          File f = new File(getExternalFilesDir(null), name);
                          FileOutputStream o = new FileOutputStream(f);
                          o.write(data); o.close();
                          return "已保存到：" + f.getAbsolutePath();
                      }
                  }

                  private void loadForPrint(final String html, final Runnable then) {
                      pdfWeb = new WebView(MainActivity.this);
                      WebSettings s = pdfWeb.getSettings();
                      s.setJavaScriptEnabled(false);
                      s.setAllowFileAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      pdfWeb.setWebViewClient(new WebViewClient() {
                          boolean done = false;
                          @Override
                          public void onPageFinished(WebView v, String u) {
                              if (done) return;
                              done = true;
                              v.postDelayed(then, 1500);
                          }
                      });
                      pdfWeb.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "utf-8", null);
                  }

                  @JavascriptInterface
                  public void makePdf(final String id, final String html, final String name) {
                      runOnUiThread(() -> {
                          try {
                              loadForPrint(html, () -> {
                                  try {
                                      PrintAttributes a = new PrintAttributes.Builder()
                                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                          .setResolution(new PrintAttributes.Resolution("pdf", "pdf", 600, 600))
                                          .setMinMargins(new PrintAttributes.Margins(500, 500, 500, 500))
                                          .build();
                                      final File out = new File(getCacheDir(), "note_export.pdf");
                                      new PdfPrint(a).print(pdfWeb.createPrintDocumentAdapter(name), out, new PdfPrint.Done() {
                                          public void ok(final File f) {
                                              new Thread(() -> {
                                                  JSONObject r = new JSONObject();
                                                  try { r.put("msg", saveBytes(name, readFile(f), "application/pdf")); }
                                                  catch (Exception e) { try { r.put("error", e.toString()); } catch (Exception ig) { } }
                                                  reply(id, r);
                                              }).start();
                                          }
                                          public void fail(String m) {
                                              JSONObject r = new JSONObject();
                                              try { r.put("error", "生成 PDF 失败：" + m); } catch (Exception ig) { }
                                              reply(id, r);
                                          }
                                      });
                                  } catch (Exception e) {
                                      JSONObject r = new JSONObject();
                                      try { r.put("error", e.toString()); } catch (Exception ig) { }
                                      reply(id, r);
                                  }
                              });
                          } catch (Exception e) {
                              JSONObject r = new JSONObject();
                              try { r.put("error", e.toString()); } catch (Exception ig) { }
                              reply(id, r);
                          }
                      });
                  }

