            md = String(md || "");
            md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => "\n\n" + put(t, true) + "\n\n");
            md = md.replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => "\n\n" + put(t, true) + "\n\n");
            md = md.replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => put(t, false));
            md = md.replace(/\$([^\$\n]+?)\$/g, (m, t) => put(t, false));
            // 没加 $ 的裸公式：整行是公式 -> 独立公式；夹在中文里 -> 行内公式
            md = md.split("\n").map(l => {
              if (!/\\[a-zA-Z]+/.test(l) || /^\s*(#|\||`)/.test(l)) return l;
              const mm = l.match(/^(\s*(?:[-*+]|\d+[.)])\s+)?(.*)$/);
              const pre = mm[1] || "", body = mm[2];
              if (!CJK.test(body) && !/\u0002/.test(body)) return pre ? pre + put(body, false) : put(body, true);
              return pre + body.replace(/[^\u3400-\u9fff\uff01-\uff5e\u3000-\u303f“”‘’\u0002\u0003]*\\[a-zA-Z]+[^\u3400-\u9fff\uff01-\uff5e\u3000-\u303f“”‘’\u0002\u0003]*/g,
                s => { const t = s.trim(); if (!t) return s; const a = s.match(/^\s*/)[0], b = s.match(/\s*$/)[0]; return a + put(t, false) + b; });
            }).join("\n");
            md = cleanMd(md);
            // 表格
            const L = md.split("\n"), out = [];
            const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
            for (let i = 0; i < L.length; i++) {
              if (/^\s*\|.*\|/.test(L[i]) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1])) {
                let h = '<div class="tbw"><table><thead><tr>' + cells(L[i]).map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
                i += 2;
                while (i < L.length && /^\s*\|/.test(L[i])) { h += "<tr>" + cells(L[i]).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>"; i++; }
                i--;
                T.push(h + "</tbody></table></div>");
                out.push("", "\u0004" + (T.length - 1) + "\u0005", "");
              } else out.push(L[i]);
            }
            let h = _render4(out.join("\n"));
            h = h.replace(/<p>\s*\u0004(\d+)\u0005\s*<\/p>/g, (m, i) => T[i]);
            h = h.replace(/<p>\s*\u0002(\d+)\u0003\s*<\/p>/g, (m, i) => '<div class="mathd">' + texHtml(M[i][0], true) + '</div>');
            h = h.replace(/\u0002(\d+)\u0003/g, (m, i) => texHtml(M[i][0], M[i][1]));
            return h;
          };
          (function () {
            const st = document.createElement("style");
            st.textContent = ".mathd{overflow-x:auto;margin:10px 0}.katex{font-size:1.08em}" +
              ".tbw{overflow-x:auto;margin:12px 0}.tbw table{border-collapse:collapse;width:100%;font-size:15px}.tbw th,.tbw td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}.tbw th{background:rgba(127,127,127,.12)}" +
              ".v4bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.v4bar select{width:auto;flex:1;min-width:140px;margin:0}.v4bar button{margin:0}" +
              "#v4note{white-space:pre-wrap;font-size:14px;background:rgba(127,127,127,.1);border-radius:8px;padding:8px 10px;margin:0 0 8px}" +
              "#v4page{position:fixed;inset:0;z-index:999;background:var(--bg,#fff);overflow:auto;padding:14px;display:none}" +
              "#v4page h3{margin:16px 0 6px}#v4page pre{white-space:pre-wrap;word-break:break-all;font-size:13px;background:rgba(127,127,127,.12);padding:10px;border-radius:8px}" +
              "#v4page img{max-width:100%;border-radius:8px;border:1px solid var(--bd)}.v4top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:inherit;padding-bottom:8px}";
            document.head.appendChild(st);
          })();

          const GOOD = new Set(["题目", "板书", "图表"]);
          const _rf4 = readFrames;
          readFrames = async function (frames) {
            const r = await _rf4(frames);
            const ok = r.filter(f => GOOD.has(f.type) && f.content && !(f.t < 15 && f.type !== "题目"));
            log("识图后保留 " + ok.length + " 张（已去掉片头、人像、动画等无关画面）");
            return ok;
          };
          const _ins4 = insertImages;
          insertImages = function (md, frames) { return _ins4(md, (frames || []).filter(f => GOOD.has(f.type))); };

          const MATHRULE = "\n【公式格式，必须遵守】所有数学符号和公式都必须用美元符号包裹：行内用 $...$，独立公式用 $$...$$（多行公式写在同一个 $$ 块里，用 \\\\ 换行）。不要用 \\( \\) 或 \\[ \\]，不要输出没有包裹的 LaTeX 命令。表格用标准 Markdown 表格（第二行是 |---|---|）。";
          let CAP = null;
          const _chat4 = chat;
          chat = async function (messages) {
            if (CAP) CAP.push(messages.map(m => ({ role: m.role, content: typeof m.content === "string" ? m.content :
              m.content.map(c => c.type === "text" ? c.text : "[图片]").join("\n") })));
            return await _chat4.apply(this, arguments);
          };
          const _sp4 = sysPrompt;
          sysPrompt = function () { return _sp4() + MATHRULE; };
          const matName = it => "mat_" + it.time + ".json";
          function loadMat(it) { if (!it || !it.mat || !HAS_NATIVE) return null; try { return JSON.parse(Native.readText(it.mat) || "null"); } catch (e) { return null; } }
          function saveMat(name, m) { if (HAS_NATIVE) Native.writeText(name, JSON.stringify(m)); }
          function updHist(item) {
            const h = loadHist(); const i = h.findIndex(x => x.time === item.time);
            if (i >= 0) h[i] = item; else h.unshift(item);
            try { localStorage.setItem("vtn_hist", JSON.stringify(h)); } catch (e) {}
            drawHist();
          }
          function framesText(segs, frames) {
            const all = frames.length ? segs.concat(frames.map(f => ({ from: f.t, to: f.t, text: "【图" + f.n + "】（" + f.type + "）" + String(f.content).replace(/\s*\n\s*/g, " / ") }))).sort((a, b) => a.from - b.from) : segs;
            return toLines(all).join("\n");
          }

          async function runV4(subOnly) {
            $("log").innerHTML = "";
            $("goBtn").disabled = $("subOnly").disabled = true;
            try {
              const info = await parseInput($("input").value.trim());
              const v = await fetchSubs2(info);
              log("文字稿共 " + v.segs.length + " 段" + (v.asr ? "（语音识别）" : ""), "o");
              const srt = toSrt(v.segs);
              const time = Date.now();
              let md, frames = [], sys = "";
              CAP = [];
              if (subOnly) md = "# " + v.title + "【字幕】\n\n" + toLines(v.segs).join("\n\n");
              else {
                if (V3.shot) {
                  try {
                    frames = await getFrames(v);
                    if (frames.length) frames = await readFrames(frames);
                    log("有效截图 " + frames.length + " 张", "o");
                  } catch (e) { log("截图/识图没成功，先生成纯文字笔记：" + e.message, "e"); frames = []; }
                }
                FRAME_MODE = frames.length > 0;
                sys = sysPrompt();
                const segsAll = FRAME_MODE
                  ? v.segs.concat(frames.map(f => ({ from: f.t, to: f.t, text: "【图" + f.n + "】（" + f.type + "）" + f.content.replace(/\s*\n\s*/g, " / ") }))).sort((a, b) => a.from - b.from)
                  : v.segs;
                try { md = await makeNotes(v.title, segsAll); } finally { FRAME_MODE = false; }
                md = cleanMd(md);
                if (frames.length) md = insertImages(md, frames);
                if (!/^#\s/.test(md.trim())) md = "# " + v.title + "\n\n" + md;
                md += "\n\n---\n来源：https://www.bilibili.com/video/" + v.bvid + "?p=" + v.p + "\n";
              }
              const item = { title: v.title, bvid: v.bvid, p: v.p, md, srt, kind: subOnly ? "sub" : "note", time, imgs: frames.map(f => f.name) };
              if (!subOnly) {
                item.mat = matName(item);
                saveMat(item.mat, {
                  title: v.title, bvid: v.bvid, p: v.p, asr: !!v.asr, style: $("style").value, req: $("req").value.trim(), ts: $("tsOn").checked,
                  sys, segs: v.segs.map(s => ({ from: s.from, to: s.to, text: s.text })),
                  frames: frames.map(f => ({ n: f.n, t: f.t, type: f.type, content: f.content, name: f.name })),
                  calls: CAP, vers: [{ md, note: "首次生成", time }], cur: 0
                });
              }
              saveHist(item); show(item);
              log("完成！", "o");
            } catch (e) {
              log("出错了：" + e.message, "e");
            } finally {
              CAP = null;
              $("goBtn").disabled = $("subOnly").disabled = false;
            }
          }
          run = async function (s) { $("busy").style.display = "block"; try { await runV4(s); } finally { $("busy").style.display = "none"; } };
          $("goBtn").onclick = () => run(false);
          $("subOnly").onclick = () => run(true);

          (function () {
            const bar = document.createElement("div");
            bar.id = "v4bar";
            bar.innerHTML =
              '<div class="v4bar"><select id="v4ver"></select><button id="v4in" class="ghost">AI 输入</button></div>' +
              '<div id="v4note" style="display:none"></div>' +
              '<details id="v4rev"><summary>不满意？写修改意见让 AI 重写</summary>' +
              '<textarea id="v4txt" rows="3" placeholder="例如：第二题的受力分析写得更详细；公式全部单独成行；删掉和题目无关的闲聊"></textarea>' +
              '<button id="v4go">按意见重写（不重新截图、不重新取字幕）</button><p class="mute" id="v4msg"></p></details>' +
              '<p class="mute" id="v4old" style="display:none">这篇是旧版本生成的，没有保存材料，不能查看 AI 输入或修改。</p>';
            $("resTitle").after(bar);
            const pg = document.createElement("div"); pg.id = "v4page"; document.body.appendChild(pg);
          })();
          let MAT = null;
          function drawNote() {
            const v = MAT && MAT.vers[MAT.cur || 0];
            const show1 = v && (MAT.cur || 0) > 0;
            $("v4note").style.display = show1 ? "block" : "none";
            if (show1) $("v4note").textContent = "第 " + (MAT.cur + 1) + " 版的修改意见：\n" + v.note;
          }
          function drawBar(item) {
            MAT = loadMat(item);
            const has = !!MAT;
            $("v4ver").parentNode.style.display = has ? "flex" : "none";
            $("v4rev").style.display = has ? "block" : "none";
            $("v4old").style.display = (!has && item.kind !== "sub") ? "block" : "none";
            if (!has) { $("v4note").style.display = "none"; return; }
            $("v4ver").innerHTML = MAT.vers.map((x, i) => '<option value="' + i + '">第 ' + (i + 1) + ' 版：' + esc(x.note.replace(/\s+/g, " ").slice(0, 12)) + (x.note.length > 12 ? "…" : "") + '</option>').join("");
            $("v4ver").value = String(MAT.cur || 0);
            drawNote();
          }
          const _show4 = show;
          show = function (item) { _show4(item); drawBar(item); };
          $("v4ver").onchange = () => {
            if (!MAT || !current) return;
            MAT.cur = parseInt($("v4ver").value);
            current.md = MAT.vers[MAT.cur].md;
            $("source").value = current.md; $("preview").innerHTML = render(current.md);
            saveMat(current.mat, MAT); updHist(current); drawNote();
          };
          $("v4in").onclick = () => {
            if (!MAT) return;
            const dir = HAS_NATIVE ? Native.filesDir() : "";
            const pre = s => "<pre>" + esc(String(s || "（无）")) + "</pre>";
            let h = '<div class="v4top"><b>本次提供给 AI 的材料</b><button id="v4close">返回</button></div>';
            h += "<h3>基本信息</h3>" + pre("标题：" + MAT.title + "\n来源：" + MAT.bvid + " P" + MAT.p + "\n文字稿：" + (MAT.asr ? "语音识别" : "B站字幕") + "，" + MAT.segs.length + " 段\n截图：" + MAT.frames.length + " 张\n笔记风格：" + MAT.style + "\n时间戳：" + (MAT.ts ? "开" : "关"));
            h += "<h3>我的要求</h3>" + pre(MAT.req);
            h += "<h3>各版本的修改意见</h3>" + pre(MAT.vers.map((x, i) => "第 " + (i + 1) + " 版：" + x.note).join("\n\n"));
            h += "<h3>System Prompt（给 AI 的规则）</h3>" + pre(MAT.sys);
            h += "<h3>截图和识图结果（" + MAT.frames.length + " 张）</h3>";
            MAT.frames.forEach(f => {
              const t = Math.floor(f.t / 60) + ":" + String(Math.floor(f.t % 60)).padStart(2, "0");
              h += "<p><b>图" + f.n + "</b> · " + esc(f.type) + " · " + t + '</p><img loading="lazy" src="file://' + dir + "/img/" + f.name + '">' + pre(f.content);
            });
            h += "<details><summary><b>文字稿全文（含截图插入位置）</b></summary>" + pre(framesText(MAT.segs, MAT.frames)) + "</details>";
            h += "<details><summary><b>实际发送的请求记录（" + (MAT.calls || []).length + " 次）</b></summary>";
            (MAT.calls || []).forEach((c, i) => { h += "<p><b>第 " + (i + 1) + " 次</b></p>" + c.map(m => "<p class='mute'>" + m.role + "</p>" + pre(m.content.length > 20000 ? m.content.slice(0, 20000) + "\n…（太长，已截断显示）" : m.content)).join(""); });
            h += "</details>";
            const pg = $("v4page"); pg.innerHTML = h; pg.style.display = "block"; pg.scrollTop = 0;
            $("v4close").onclick = () => { pg.style.display = "none"; };
          };
          $("v4go").onclick = async () => {
            if (!MAT || !current) return;
            const note = $("v4txt").value.trim();
            if (!note) { alert("先写修改意见"); return; }
            const btn = $("v4go"); btn.disabled = true; $("v4msg").textContent = "正在重写，大约半分钟到两分钟…";
            CAP = [];
            try {
              const prev = $("source").value.replace(/!\[图(\d+)\]\(img\/[^)\s]+\)/g, "【图$1】").replace(/\n---\n来源：[^\n]*\n?$/, "");
              let mat = framesText(MAT.segs, MAT.frames);
              if (mat.length > 60000) mat = mat.slice(0, 60000) + "\n…（后面省略）";
              let base = MAT.sys || sysPrompt(); if (base.indexOf("【公式格式") < 0) base += MATHRULE;
              const sys = base + "\n\n【修改模式】用户对上一版笔记不满意，会给出修改意见。请根据原始材料和上一版笔记，按意见输出修改后的完整笔记（Markdown，从一级标题开始），不要解释改了什么。保留上一版中合理的部分和【图N】标记。再次强调：公式只能用 $...$ 或 $$...$$ 包裹。";
              const user = "视频标题：" + MAT.title + "\n\n【原始材料：字幕和截图识别】\n" + mat + "\n\n【上一版笔记】\n" + prev + "\n\n【修改意见】\n" + note;
              let md = await chat([{ role: "system", content: sys }, { role: "user", content: user }]);
              md = cleanMd(md);
              if (!MAT.ts) md = stripTs(md);
              if (MAT.frames.length) md = insertImages(md, MAT.frames);
              if (!/^#\s/.test(md.trim())) md = "# " + MAT.title + "\n\n" + md;
              md += "\n\n---\n来源：https://www.bilibili.com/video/" + MAT.bvid + "?p=" + MAT.p + "\n";
              MAT.vers.push({ md, note, time: Date.now() }); MAT.cur = MAT.vers.length - 1;
              MAT.calls = (MAT.calls || []).concat(CAP);
              current.md = md; saveMat(current.mat, MAT); updHist(current);
              show(current); $("v4txt").value = "";
              $("v4msg").textContent = "已生成第 " + MAT.vers.length + " 版，可在上方下拉框切换各版本。";
            } catch (e) { $("v4msg").textContent = "重写失败：" + e.message; }
            finally { CAP = null; btn.disabled = false; }
          };

          // ===== v1.5：导出 PDF / 图文 MD =====
          const PCSS = "body{font-family:sans-serif;font-size:15px;line-height:1.75;color:#222;margin:0}" +
            "h1{font-size:24px;border-bottom:2px solid #2f6fed;padding-bottom:6px}h2{font-size:20px;border-left:4px solid #2f6fed;padding-left:8px;margin-top:22px}h3{font-size:17px}" +
            "a{color:inherit;text-decoration:none}code{background:#f2f2f2;padding:0 3px;border-radius:3px}" +
            ".shot,.tbw,.mathd,table,img{page-break-inside:avoid;break-inside:avoid}.shot{margin:12px 0}.shot img{max-width:100%;border:1px solid #ddd;border-radius:6px;display:block}.shot figcaption{font-size:12px;color:#888}" +
            ".tbw table{border-collapse:collapse;width:100%;font-size:14px}.tbw th,.tbw td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}.tbw th{background:#eef2fb}" +
            ".mathd{margin:10px 0}.katex{font-size:1.05em}h1,h2,h3{page-break-after:avoid;break-after:avoid}";
          function pdfHtml(md) {
            return '<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="katex/katex.min.css"><style>' + PCSS +
              '</style></head><body>' + render(md) + '</body></html>';
          }
          function curMd() { if (current) current.md = $("source").value; return current ? current.md : ""; }
          function verTag() { return MAT && MAT.vers.length > 1 ? "_第" + ((MAT.cur || 0) + 1) + "版" : ""; }
          (function () {
            const d = document.createElement("div");
            d.className = "v4bar";
            d.innerHTML = '<button id="v5pdf">导出 PDF</button><button id="v5md" class="ghost">导出图文 MD</button><button id="v5prt" class="ghost">系统打印</button><span class="mute" id="v5msg"></span>';
            $("v4bar").appendChild(d);
          })();
          $("v5pdf").onclick = async () => {
            if (!current) return;
            const b = $("v5pdf"); b.disabled = true; $("v5msg").textContent = "正在生成 PDF…";
            try {
              const r = await ncall("makePdf", pdfHtml(curMd()), safeName(current.title) + verTag() + ".pdf");
              $("v5msg").textContent = r.msg; alert(r.msg + "\n\n如果打开后公式或图片缺失，可以改用“系统打印”→ 保存为 PDF。");
            } catch (e) { $("v5msg").textContent = ""; alert("导出失败：" + e.message + "\n可以改用“系统打印”→ 保存为 PDF。"); }
            finally { b.disabled = false; }
          };
          $("v5prt").onclick = () => { if (current && HAS_NATIVE) Native.printPdf(pdfHtml(curMd()), safeName(current.title)); };
          $("v5md").onclick = () => {
            if (!current || !HAS_NATIVE) return;
            let miss = 0;
            const md = curMd().replace(/\]\(img\/([^)\s]+)\)/g, (m, n) => { const b = Native.readB64(n); if (!b) { miss++; return m; } return "](data:image/jpeg;base64," + b + ")"; });
            alert(Native.saveFile(safeName(current.title) + verTag() + "_图文.md", md) + (miss ? "\n有 " + miss + " 张图片找不到，保留了原链接。" : "\n图片已直接嵌入文件，换设备打开也能看到。"));
          };
          // ===== v1.5.1：PDF 改为打印主界面里的专用区域 =====
          (function () {
            const pa = document.createElement("div"); pa.id = "v5print"; document.body.appendChild(pa);
            const st = document.createElement("style");
            st.textContent = "#v5print{display:none}" +
              "@media print{html,body{background:#fff!important;color:#222!important}" +
              "body>*:not(#v5print){display:none!important}#v5print{display:block!important;padding:0;margin:0}" +
              PCSS.replace(/body\{/g, "#v5print{") + "}";
            document.head.appendChild(st);
          })();
          async function fillPrint(md) {
            const pa = $("v5print");
            pa.innerHTML = render(md);
            const imgs = Array.from(pa.querySelectorAll("img"));
            imgs.forEach(i => { i.loading = "eager"; });
            await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; setTimeout(r, 8000); })));
            if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
            await new Promise(r => setTimeout(r, 300));
          }
          $("v5pdf").onclick = async () => {
            if (!current || !HAS_NATIVE) return;
            const b = $("v5pdf"); b.disabled = true; $("v5msg").textContent = "正在准备图片和公式…";
            const old = window.__nativeProg;
            window.__nativeProg = (id, msg) => { $("v5msg").textContent = msg; log(msg); };
            try {
              await fillPrint(curMd());
              const r = await Promise.race([
                ncall("makePdf2", safeName(current.title) + verTag() + ".pdf"),
                new Promise((_, rej) => setTimeout(() => rej(new Error("超过 90 秒没有完成")), 90000))
              ]);
              $("v5msg").textContent = r.msg; alert(r.msg);
            } catch (e) {
              $("v5msg").textContent = "导出失败";
              alert("导出失败：" + e.message + "\n可以改用“系统打印”→ 保存为 PDF。请把这条提示截图发给我。");
            } finally { window.__nativeProg = old; b.disabled = false; }
          };
          $("v5prt").onclick = async () => {
            if (!current || !HAS_NATIVE) return;
            $("v5msg").textContent = "正在打开系统打印…";
            await fillPrint(curMd());
            Native.printPdf2(safeName(current.title) + verTag());
            $("v5msg").textContent = "";
          };
          </script>
          </body>
          </html>
          VTN_EOF

      - name: Fetch KaTeX
        run: |
          curl -fsSL https://registry.npmjs.org/katex/-/katex-0.16.11.tgz -o katex.tgz
          tar xzf katex.tgz
          mkdir -p app/src/main/assets/katex
          cp package/dist/katex.min.js package/dist/katex.min.css app/src/main/assets/katex/
          cp -r package/dist/fonts app/src/main/assets/katex/
          rm -rf package katex.tgz
          ls app/src/main/assets/katex

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoToNote-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoToNote-Lite
          path: VideoToNote-Lite.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 视频笔记精简版 第${{ github.run_number }}版
          files: VideoToNote-Lite.apk
