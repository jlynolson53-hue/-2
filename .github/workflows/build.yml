                  });
                  web.setWebChromeClient(new WebChromeClient());
                  web.addJavascriptInterface(new Bridge(), "Native");
                  readShare(getIntent());
                  web.loadUrl(HOME);
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  readShare(i);
                  web.loadUrl(HOME);
              }

              private void readShare(Intent i) {
                  if (i != null && Intent.ACTION_SEND.equals(i.getAction())) {
                      String t = i.getStringExtra(Intent.EXTRA_TEXT);
                      if (t != null) sharedText = t;
                  }
              }

              @Override
              public void onBackPressed() {
                  String u = web.getUrl();
                  if (u != null && !u.startsWith("file:")) {
                      CookieManager.getInstance().flush();
                      web.loadUrl(HOME);
                  } else {
                      super.onBackPressed();
                  }
              }

              private static String readAll(InputStream in) throws Exception {
                  if (in == null) return "";
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  return new String(bo.toByteArray(), StandardCharsets.UTF_8);
              }

              private JSONObject doHttp(String method, String url, String headersJson, String body) {
                  JSONObject r = new JSONObject();
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod(method);
                      c.setConnectTimeout(20000);
                      c.setReadTimeout(300000);
                      c.setInstanceFollowRedirects(true);
                      if (headersJson != null && headersJson.length() > 0) {
                          JSONObject h = new JSONObject(headersJson);
                          Iterator<String> it = h.keys();
                          while (it.hasNext()) {
                              String k = it.next();
                              c.setRequestProperty(k, h.getString(k));
                          }
                      }
                      if (url.contains("bilibili.com")) {
                          String ck = CookieManager.getInstance().getCookie(url);
                          if (ck != null) c.setRequestProperty("Cookie", ck);
                      }
                      if (body != null && body.length() > 0) {
                          c.setDoOutput(true);
                          OutputStream o = c.getOutputStream();
                          o.write(body.getBytes(StandardCharsets.UTF_8));
                          o.close();
                      }
                      int code = c.getResponseCode();
                      InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      r.put("status", code);
                      r.put("body", readAll(in));
                      r.put("url", c.getURL().toString());
                  } catch (Exception e) {
                      try { r.put("error", e.toString()); } catch (Exception ignored) { }
                  }
                  return r;
              }


              static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";

              private void prog(String id, String msg) {
                  final String js = "window.__nativeProg&&window.__nativeProg(" + JSONObject.quote(id) + "," + JSONObject.quote(msg) + ")";
                  runOnUiThread(() -> web.evaluateJavascript(js, null));
              }

              private void reply(String id, JSONObject r) {
                  final String js = "window.__nativeCb(" + JSONObject.quote(id) + "," + JSONObject.quote(r.toString()) + ")";
                  runOnUiThread(() -> web.evaluateJavascript(js, null));
              }

              private static byte[] readFile(File f) throws Exception {
                  FileInputStream in = new FileInputStream(f);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[65536];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  return bo.toByteArray();
              }

              private String uploadAsr(File f, String key, String model) throws Exception {
                  String bd = "----vtn" + System.currentTimeMillis();
                  HttpURLConnection c = (HttpURLConnection) new URL("https://api.siliconflow.cn/v1/audio/transcriptions").openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(30000);
                  c.setReadTimeout(300000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Authorization", "Bearer " + key);
                  c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + bd);
                  OutputStream o = c.getOutputStream();
                  o.write(("--" + bd + "\r\nContent-Disposition: form-data; name=\"model\"\r\n\r\n" + model + "\r\n").getBytes(StandardCharsets.UTF_8));
                  o.write(("--" + bd + "\r\nContent-Disposition: form-data; name=\"file\"; filename=\"" + f.getName() + "\"\r\nContent-Type: audio/mp4\r\n\r\n").getBytes(StandardCharsets.UTF_8));
                  o.write(readFile(f));
                  o.write(("\r\n--" + bd + "--\r\n").getBytes(StandardCharsets.UTF_8));
                  o.close();
                  int code = c.getResponseCode();
                  String body = readAll(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  if (code != 200) {
                      String tip = code == 401 ? "硅基流动 Key 不对或已失效" : (code == 403 ? "硅基流动账号没有权限（可能需要实名认证）" : "语音识别失败");
                      throw new Exception(tip + "（状态码 " + code + "）：" + body.substring(0, Math.min(200, body.length())));
                  }
                  return new JSONObject(body).optString("text", "");
              }

              public class Bridge {
                  @JavascriptInterface
                  public void request(final String id, final String method, final String url,
                                      final String headersJson, final String body) {
                      new Thread(() -> {
                          JSONObject r = doHttp(method, url, headersJson, body);
                          final String js = "window.__nativeCb(" + JSONObject.quote(id) + "," + JSONObject.quote(r.toString()) + ")";
                          runOnUiThread(() -> web.evaluateJavascript(js, null));
                      }).start();
                  }

                  @JavascriptInterface
                  public String md5(String s) {
                      try {
                          MessageDigest md = MessageDigest.getInstance("MD5");
                          byte[] d = md.digest(s.getBytes(StandardCharsets.UTF_8));
                          StringBuilder sb = new StringBuilder();
                          for (byte x : d) sb.append(String.format("%02x", x & 0xff));
                          return sb.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

